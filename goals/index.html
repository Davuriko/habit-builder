<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="description" content="Habit Builder - pelacak goals & kebiasaan harian yang berjalan di semua perangkat." />
  <title>Habit Builder</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar / Header -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <span class="brand-text">HABIT BUILDER</span>
      </div>
      <div class="month-nav">
        <button id="prevMonth" class="icon-btn" aria-label="Bulan sebelumnya">‹</button>
        <button id="monthTitle" class="month-title" aria-label="Pilih bulan"></button>
        <button id="nextMonth" class="icon-btn" aria-label="Bulan berikutnya">›</button>
      </div>
      <div class="topbar-actions">
        <button id="themeBtn" class="icon-btn" title="Ganti tema" aria-label="Ganti tema gelap/terang">🌙</button>
        <button id="exportBtn" class="icon-btn" title="Ekspor / backup data" aria-label="Ekspor data">⭳</button>
        <button id="importBtn" class="icon-btn" title="Impor data dari file" aria-label="Impor data">⭱</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden />
        <button id="installBtn" class="ghost-btn" hidden>Install App</button>
      </div>
    </header>

    <!-- Progress overview -->
    <section class="overview">
      <div class="overview-card">
        <div class="overview-label">Progress Bulan Ini</div>
        <div class="overview-value"><span id="monthPercent">0%</span></div>
        <div class="progress-track"><div id="monthProgress" class="progress-fill"></div></div>
      </div>
      <div class="overview-card">
        <div class="overview-label">Hari Selesai</div>
        <div class="overview-value"><span id="daysDone">0</span><small>/ <span id="daysTotal">0</span></small></div>
      </div>
      <div class="overview-card">
        <div class="overview-label">Streak Terpanjang</div>
        <div class="overview-value"><span id="streak">0</span><small>hari</small></div>
      </div>
      <div class="overview-card">
        <div class="overview-label">Jumlah Habit</div>
        <div class="overview-value"><span id="habitCount">0</span></div>
      </div>
    </section>

    <!-- Habit manager -->
    <section class="panel">
      <div class="panel-head">
        <h2>My Habits</h2>
        <form id="addHabitForm" class="add-habit">
          <input id="habitInput" type="text" maxlength="40" placeholder="Tambah habit baru…" autocomplete="off" />
          <button type="submit" class="primary-btn">+ Tambah</button>
        </form>
      </div>
      <ul id="habitList" class="habit-list"></ul>
    </section>

    <!-- Tracker grid -->
    <section class="panel">
      <div class="panel-head">
        <h2>Tracker Harian</h2>
        <div class="legend">
          <span><i class="dot done"></i> Selesai</span>
          <span><i class="dot"></i> Belum</span>
        </div>
      </div>
      <div class="grid-scroll">
        <table id="trackerTable" class="tracker"></table>
      </div>
    </section>

    <footer class="foot">
      <span>Data tersimpan otomatis di perangkat ini.</span>
      <button id="resetMonth" class="link-btn">Reset bulan ini</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
